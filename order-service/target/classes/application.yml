server:
  port: 8081

spring:
  application:
    name: order-service

  # Database Configuration linking to your PostgreSQL Container
  datasource:
    url: jdbc:postgresql://order-db:5432/order_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Database Migration Configuration (Liquibase)
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Kafka Infrastructure Configuration
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring:
        json:
          add:
            type:
              headers: true

# Management Endpoints for Health checks
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
