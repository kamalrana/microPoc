server:
  port: 8083

spring:
  application:
    name: inventory-service

  # Database Configuration linking to your shared PostgreSQL Container
  datasource:
    url: jdbc:postgresql://order-db:5432/order_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Database Migration Configuration (Liquibase)
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Kafka Infrastructure Consumer Configuration
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.microservices.order.event,com.example.order.event"

# Management Endpoints for Health checks
management:
  endpoints:
    web:
      exposure:
        include: health, info
