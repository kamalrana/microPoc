services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: poc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REREPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  order-db:
    image: postgres:15-alpine
    container_name: poc-order-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

  api-gateway:
    image: eclipse-temurin:17-jdk-alpine
    container_name: poc-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./api-gateway/target/api-gateway-1.0.0.jar:/app.jar
    command: ["java", "-jar", "/app.jar"]
    depends_on:
      - order-service

  order-service:
    image: eclipse-temurin:17-jdk-alpine
    container_name: poc-order-service
    ports:
      - "8081:8081"
    volumes:
      - ./order-service/target/order-service-1.0.0.jar:/app.jar
    command: ["java", "-jar", "/app.jar"]
    depends_on:
      - kafka
      - order-db

  payment-service:
    image: eclipse-temurin:17-jdk-alpine
    container_name: poc-payment-service
    ports:
      - "8082:8082"
    volumes:
      - ./payment-service/target/payment-service-1.0.0.jar:/app.jar
    command: ["java", "-jar", "/app.jar"]
    depends_on:
      - kafka

  inventory-service:
    image: eclipse-temurin:17-jdk-alpine
    container_name: poc-inventory-service
    ports:
      - "8083:8083"
    volumes:
      - ./inventory-service/target/inventory-service-1.0.0.jar:/app.jar
    command: ["java", "-jar", "/app.jar"]
    depends_on:
      - kafka
